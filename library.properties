name=ACAN2518FD
version=1.0.0
author=Pierre Molinaro, Neil Emiro
maintainer=Neil Emiro / ND Performance
sentence=Driver for the MCP2518FD CAN controller in CAN FD mode, with sleep and bus wake-up support.
paragraph=Fork of Pierre Molinaro's ACAN2517FD 2.1.16, specialised for the MCP2518FD and extended with the sleep/wake API upstream does not provide: WAKIE, the wake-up filter, verified Sleep entry, and a bounded oscillator restart that is usable before begin(). Identical to ACAN2517FD in every other respect, so an existing sketch ports by renaming the types. Default configuration sends and receives any frame - no default filter to provide; up to 32 reception filters can be defined.
category=Communication
url=https://github.com/nemirog1/acan2518FD
architectures=*
